[project]
name = "bridge-tools"
version = "0.1.0"
description = "Python helpers for midi-bridge: report rendering and online song search"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.11.2",
    "numpy>=2.2",
    "requests>=2.32",
]

[project.scripts]
report-renderer = "bridge_tools.report.cli:main"
song-search = "bridge_tools.search.cli:main"
score-renderer = "bridge_tools.score.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8.4",
    # Black-box test harness: virtual MIDI ports + the original bridge as reference.
    "mido==1.3.3",
    "python-rtmidi==1.5.8",
    "pillow>=11",
    "pypdf>=6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bridge_tools"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
# These two import lazily on purpose: they patch libraries before the original code runs.
"tests/reference/run_reference.py" = ["PLC0415"]
"tests/golden/generate_golden.py" = ["PLC0415"]
"tests/**" = ["E501"]
# A random file generator is branchy by nature.
"tests/differential/*" = ["PLR0912", "PLR0915"]
# Report text is user-facing prose, kept on one line per sentence.
"python/src/bridge_tools/report/text.py" = ["E501"]
"python/src/bridge_tools/report/pages.py" = ["E501"]
